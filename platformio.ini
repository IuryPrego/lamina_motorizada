; Firmware da lâmina motorizada — Arduino Uno + CNC Shield v3
; (não usa bibliotecas externas)
;
; Compilar e gravar:   pio run -t upload
; Testar à mão:        pio device monitor   (digite X G 90, X P, X S... e Enter)

; O código do firmware fica em firmware/ (o resto da raiz é a parte Python)
[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Descomente para fixar a porta (senão o PlatformIO detecta sozinho)
; upload_port = COM4
; monitor_port = COM4

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

; Se a placa for um Nano, use este ambiente: pio run -e nano -t upload
[env:nano]
platform = atmelavr
board = nanoatmega328new   ; troque por nanoatmega328 se for bootloader antigo
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
